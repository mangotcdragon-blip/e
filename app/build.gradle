plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oiia.puzzlevault'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oiia.puzzlevault'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK is installable
            // without setting up a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep the video untouched inside the APK.
    androidResources {
        noCompress 'mp4'
    }
}
