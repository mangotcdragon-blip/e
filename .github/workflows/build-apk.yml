name: Build APK

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's own default package list still requests the long-deprecated legacy
          # "tools" package, which Google has now fully removed from the SDK repository - every
          # build was failing before even reaching Gradle because of that, unrelated to app code.
          # Everything a modern Gradle/AGP build actually needs is covered by these three.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PappVersionCode=${{ github.run_number }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a release for easy mobile download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Calculator build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
