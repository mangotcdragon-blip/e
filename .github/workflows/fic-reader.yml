name: Build Fic Reader APK

on:
  push:
    paths:
      - "fic-reader/**"
      - ".github/workflows/fic-reader.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: fic-reader
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fic-reader-apk
          path: fic-reader/app/build/outputs/apk/release/*.apk
