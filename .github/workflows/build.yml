name: Build MicFix

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate project
        run: |
          mkdir -p micfix/src/main/java/dev/micfix micfix/src/main/assets
          cd micfix

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = 'micfix'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'dev.micfix'
              compileSdk 34
              defaultConfig {
                  applicationId 'dev.micfix'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { compileOnly 'de.robv.android.xposed:api:82' }
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Discord MicFix">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription"
                      android:value="Keeps the microphone type on Discord's foreground service during screen share" />
                  <meta-data android:name="xposedminversion" android:value="82" />
              </application>
          </manifest>
          EOF

          echo "dev.micfix.Hook" > src/main/assets/xposed_init

          cat > src/main/java/dev/micfix/Hook.java <<'EOF'
          package dev.micfix;

          import android.app.Notification;
          import android.app.Service;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class Hook implements IXposedHookLoadPackage {
              // android.content.pm.ServiceInfo constants
              static final int TYPE_MEDIA_PROJECTION = 0x20;
              static final int TYPE_MICROPHONE = 0x80;

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lp) {
                  XposedHelpers.findAndHookMethod(Service.class, "startForeground",
                          int.class, Notification.class, int.class, new XC_MethodHook() {
                      @Override
                      protected void beforeHookedMethod(MethodHookParam p) throws Throwable {
                          String cls = p.thisObject.getClass().getName();
                          if (!cls.contains("foreground_service")) return;

                          int type = (Integer) p.args[2];
                          XposedBridge.log("MicFix: startForeground type=0x" + Integer.toHexString(type));
                          if ((type & TYPE_MEDIA_PROJECTION) == 0 || (type & TYPE_MICROPHONE) != 0) return;

                          Object[] args = p.args.clone();
                          args[2] = type | TYPE_MICROPHONE;
                          try {
                              XposedBridge.invokeOriginalMethod(p.method, p.thisObject, args);
                              p.setResult(null);
                              XposedBridge.log("MicFix: added microphone type -> 0x"
                                      + Integer.toHexString(type | TYPE_MICROPHONE));
                          } catch (Throwable t) {
                              // If Android rejects it, fall back to Discord's original call
                              XposedBridge.log("MicFix: could not add microphone type: " + t);
                          }
                      }
                  });
              }
          }
          EOF

      - name: Build APK
        working-directory: micfix
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: discord-micfix
          path: micfix/build/outputs/apk/debug/*.apk
