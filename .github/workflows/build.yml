name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the release step below, which runs on tags.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifimouse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK as a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "wifimouse-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "wifimouse-${GITHUB_REF_NAME}.apk" \
            --title "WiFi Mouse $GITHUB_REF_NAME" \
            --notes "Android app for using a phone as a mouse over Wi-Fi, in trackpad or camera mode.

          Install the APK on the phone, then run the server on the PC:

              git clone -b ${GITHUB_REF_NAME} https://github.com/${GITHUB_REPOSITORY}.git
              cd e/server && py -3 wifimouse_server.py

          The APK is debug-signed, so Android will ask you to allow installing from unknown sources. See the README for setup and gestures."

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  server:
    name: Desktop server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest server/tests -q
