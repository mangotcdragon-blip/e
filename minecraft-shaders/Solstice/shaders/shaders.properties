# Solstice Shaders - OptiFine / Iris pack configuration

# ---------------------------------------------------------------- vanilla features
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
sun=false
moon=true
separateAo=true
frustum.culling=true
particles.before.deferred=true
rain.depth=false
beacon.beam.depth=true

#ifdef VOLUMETRIC_CLOUDS
clouds=off
#endif

texture.noise=tex/noise.png

# No shadow map outside the overworld
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false

# ---------------------------------------------------------------- blending
# Translucents accumulate premultiplied colour in colortex3; their data buffer is never blended.
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex4=off
blend.gbuffers_hand_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex4=off
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Packed normals/material data must never be blended.
blend.gbuffers_basic.colortex1=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_clouds.colortex1=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_beaconbeam.colortex1=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_spidereyes.colortex1=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off

# ---------------------------------------------------------------- options menu
screen=<profile> <empty> [SHADOWS] [LIGHTING] [SKY] [WATER] [MATERIALS] [POST] <empty> <empty> sunPathRotation

screen.SHADOWS=shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION shadowDistanceRenderMul \
    COLORED_SHADOWS CLOUD_SHADOWS SUBSURFACE_SCATTERING SSS_STRENGTH

screen.LIGHTING=SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_STRENGTH MIN_LIGHT BLOCKLIGHT_STRENGTH EMISSIVE_STRENGTH \
    HANDHELD_LIGHT VANILLA_AO_STRENGTH <empty> <empty> [BLOCKLIGHT] [AO]
screen.BLOCKLIGHT=BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B
screen.AO=SSAO SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH

screen.SKY=SKY_BRIGHTNESS SUN_DISC_SIZE STARS STAR_AMOUNT <empty> <empty> [CLOUDS] [FOG]
screen.CLOUDS=VOLUMETRIC_CLOUDS CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED
screen.FOG=FOG_DENSITY BORDER_FOG VOLUMETRIC_LIGHT VL_STEPS VL_STRENGTH

screen.WATER=WATER_WAVES WAVE_HEIGHT WAVE_SPEED WATER_REFRACTION REFRACTION_STRENGTH WATER_CAUSTICS WATER_FOG_DENSITY WATER_BIOME_TINT \
    <empty> <empty> [REFLECTIONS]
screen.REFLECTIONS=SSR SSR_STEPS SSR_REFINE_STEPS

screen.MATERIALS=PBR_MODE NORMAL_MAP_STRENGTH RAIN_PUDDLES PUDDLE_AMOUNT <empty> <empty> WAVING_PLANTS WAVING_LEAVES WAVING_STRENGTH

screen.POST=TAA TAA_BLEND SHARPENING <empty> BLOOM BLOOM_STRENGTH <empty> <empty> AUTO_EXPOSURE EXPOSURE EXPOSURE_SPEED <empty> \
    TONEMAP SATURATION CONTRAST VIGNETTE

screen.SHADOWS.columns=2
screen.LIGHTING.columns=2
screen.SKY.columns=2
screen.WATER.columns=2
screen.MATERIALS.columns=2
screen.POST.columns=2

sliders=shadowMapResolution shadowDistance sunPathRotation SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION SSS_STRENGTH \
    SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_STRENGTH MIN_LIGHT BLOCKLIGHT_STRENGTH EMISSIVE_STRENGTH VANILLA_AO_STRENGTH \
    BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH \
    SKY_BRIGHTNESS SUN_DISC_SIZE STAR_AMOUNT CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_ALTITUDE \
    CLOUD_THICKNESS CLOUD_SPEED FOG_DENSITY VL_STEPS VL_STRENGTH \
    WAVE_HEIGHT WAVE_SPEED REFRACTION_STRENGTH WATER_FOG_DENSITY WATER_BIOME_TINT SSR_STEPS SSR_REFINE_STEPS \
    NORMAL_MAP_STRENGTH PUDDLE_AMOUNT WAVING_STRENGTH \
    TAA_BLEND SHARPENING BLOOM_STRENGTH EXPOSURE EXPOSURE_SPEED SATURATION CONTRAST VIGNETTE

# ---------------------------------------------------------------- profiles
profile.LOW=shadowMapResolution=1024 shadowDistance=96.0 SHADOW_SAMPLES=8 !COLORED_SHADOWS !SSAO \
    !VOLUMETRIC_LIGHT CLOUD_STEPS=8 CLOUD_LIGHT_STEPS=2 SSR_STEPS=12 SSR_REFINE_STEPS=3
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=12 COLORED_SHADOWS SSAO SSAO_SAMPLES=6 \
    VOLUMETRIC_LIGHT VL_STEPS=8 CLOUD_STEPS=12 CLOUD_LIGHT_STEPS=3 SSR_STEPS=16 SSR_REFINE_STEPS=3
profile.HIGH=shadowMapResolution=2048 shadowDistance=160.0 SHADOW_SAMPLES=16 COLORED_SHADOWS SSAO SSAO_SAMPLES=8 \
    VOLUMETRIC_LIGHT VL_STEPS=10 CLOUD_STEPS=20 CLOUD_LIGHT_STEPS=4 SSR_STEPS=24 SSR_REFINE_STEPS=5
profile.ULTRA=shadowMapResolution=4096 shadowDistance=256.0 SHADOW_SAMPLES=32 COLORED_SHADOWS SSAO SSAO_SAMPLES=12 \
    VOLUMETRIC_LIGHT VL_STEPS=16 CLOUD_STEPS=32 CLOUD_LIGHT_STEPS=6 SSR_STEPS=48 SSR_REFINE_STEPS=8
