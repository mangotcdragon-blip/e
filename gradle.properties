org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Minecraft / Forge
minecraft_version=1.20.1
forge_version=47.3.0
minecraft_version_range=[1.20.1,1.20.2)
forge_version_range=[47,)
loader_version_range=[47,)

# Mod metadata. NOTE: Forge mod ids must match ^[a-z][a-z0-9_]{1,63}$ so the
# hyphenated Fabric id cannot be reused here. The *resource namespace* stays
# `villager-news-addon-port` (hyphens are legal in a ResourceLocation namespace),
# which keeps every texture, model and sound path identical to the Fabric build.
mod_id=vnap
mod_namespace=villager-news-addon-port
mod_name=Villager News Addon Port
mod_version=1.3.0
mod_group_id=com.vnap
mod_license=All-Rights-Reserved
mod_authors=Oreville Studios Ltd, Element Animation, Java port assembled by marcy
mod_description=A Java Edition port of Villager News with contextual dialogue and EMF, ETF and ESF models, textures and sounds.

# Optional rendering dependencies (Modrinth version ids). These MUST be changed
# to 1.20.1-Forge builds before the first build; the ids below are the Fabric
# ones inherited from the upstream project and will not resolve here.
emf_version=p8M0c1vN
etf_version=5wNzCsUb
