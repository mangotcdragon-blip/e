modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MarcYohannTheScripter/villager-news-addon-port/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    type="required"
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# EMF/ETF are client-side renderers for the OptiFine-format models and textures
# this mod ships. They are optional so a dedicated server can load the mod, and
# so the client still starts (with vanilla villager models) when they are absent.
[[dependencies.${mod_id}]]
    modId="entity_model_features"
    type="optional"
    versionRange="[2.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="entity_texture_features"
    type="optional"
    versionRange="[6.0,)"
    ordering="AFTER"
    side="CLIENT"
