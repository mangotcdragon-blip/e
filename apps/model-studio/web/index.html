<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="theme-color" content="#16181d" />
	<title>Model Studio</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<div id="app">
		<header id="topbar">
			<div id="title">Model Studio</div>
			<button id="btn-fit" class="icon-btn" aria-label="Fit model in view" title="Fit model in view"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
			<button id="btn-open" class="btn primary small" type="button">Open</button>
		</header>
		<main id="stage">
			<div id="viewport"></div>
			<div id="empty">
				<div class="empty-card">
					<svg class="logo" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
					<h1>Model Studio</h1>
					<p>View, restyle, animate and convert 3D models and Minecraft models.</p>
					<button id="empty-open" class="btn primary big" type="button">Open a 3D file</button>
					<button id="empty-convert" class="btn big" type="button">Convert a file</button>
					<button id="empty-sample" class="btn ghost" type="button">Try the sample robot</button>
				</div>
			</div>
			<div id="hud" class="hidden"></div>
			<div id="toast"></div>
			<div id="busy"><div class="spinner"></div><span></span></div>
		</main>
		<aside id="sheet">
			<div class="sheet-head">
				<h2 id="sheet-title"></h2>
				<button id="sheet-close" class="icon-btn" aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
			</div>
			<div id="sheet-body"></div>
		</aside>
		<nav id="tabs"></nav>
	</div>
	<input id="file-input" type="file" multiple hidden />
	<script src="app.js"></script>
</body>
</html>
